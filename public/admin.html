<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0b0b"><title>ONGIT | 관리자</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="header"><div class="wrap nav"><a class="logo brand-logo logo-image" href="/" aria-label="온기잇 홈"><img class="ongit-logo-img" src="/ongit-logo.svg" alt="ongit better life"></a><nav><a href="/">사이트 보기 ↗</a></nav></div></header>
<main class="wrap admin-main"><div id="loginView" class="panel login-panel"><div class="eyebrow">PRIVATE ACCESS</div><h1>관리자 로그인</h1><p class="subtle">상품 관리 권한이 있는 관리자만 접속할 수 있습니다.</p><form id="loginForm"><div class="field"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">로그인 →</button><p id="loginStatus" class="status" role="status"></p></form></div>
<div id="dashboard" class="hidden"><div class="admin-head"><div><div class="eyebrow">ONGIT PRODUCT MANAGER</div><h1>상품 관리</h1><p class="subtle">상품을 등록하고 순서와 공개 여부를 관리하세요.</p></div><button id="logoutBtn" class="btn secondary">로그아웃</button></div>
<section class="panel"><h2 id="formTitle">새 상품 등록</h2><form id="productForm"><div class="columns"><div><div class="field"><label for="name">상품명 *</label><input id="name" maxlength="100" required placeholder="예: 스텐 얼음"></div><div class="field"><label for="price">판매 가격 (원) *</label><input id="price" type="number" min="0" max="1000000000" step="1" required placeholder="19800"></div><div class="field"><label for="coupang_url">쿠팡 구매 링크 (https://...coupang.com)</label><input id="coupang_url" type="url" placeholder="https://www.coupang.com/..."></div></div><div><div class="field"><label for="description">상품 설명</label><textarea id="description" maxlength="2000" placeholder="제품의 매력을 짧게 적어 주세요."></textarea></div><div class="field"><label for="imageFile">상품 사진 (JPG / PNG / WebP / GIF, 5MB 이하)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><img class="preview hidden" id="imagePreview" alt="현재 상품 이미지"><label class="check-row"><input type="checkbox" id="visible" checked> 쇼핑몰에 공개</label></div></div><div class="actions"><button id="saveBtn" class="btn" type="submit">상품 저장</button><button id="cancelBtn" class="btn secondary hidden" type="button">수정 취소</button></div><p class="status" id="formStatus" role="status"></p></form></section>
<section class="panel"><div class="admin-head"><div><h2>등록 상품</h2><p class="subtle">↑ ↓ 버튼으로 노출 순서를 바꿀 수 있습니다. 숨긴 상품은 고객에게 표시되지 않습니다.</p></div><button class="btn secondary" id="refreshBtn">새로고침</button></div><div class="admin-list" id="adminList"></div><p class="status" id="listStatus" role="status"></p></section></div></main>
<script src="/admin.js" defer></script></body></html>
